<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>

<body>
  <div class="main">
    <video id="video" autoplay style="display:none;"></video>
    <video id="preview" controls style="display:none; width: 100%; max-height: 300px;"></video> <!-- Video preview -->
    <a id="download-link" style="display:none;"><i class="fas fa-download"></i></a>
  </div>

  <div id="screenshotDiv" style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
    " class="ctaDiv">
    <div style="
            position: relative;
            background-color: white;
            padding: 10px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3),
                        0 6px 20px 0 rgba(0, 0, 0, 0.25);
        ">
      <img id="screenshotImg" src="" alt="screenshot" style="width:80vw; height:80vh; object-fit:contain;">
      <button onclick="document.getElementById('screenshotDiv').style.display = 'none';"
        style="position:absolute; transform:translateY(-100%); right:0; top:0;">
        Close
      </button>
      <button id="downloadScreenshot" style="position:absolute; transform:translateY(-100%); right:100px; top:0;">
        Download
      </button>
    </div>
  </div>

  <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
    <div
      style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80vw; display:flex; flex-direction: column; align-items: center;">
      <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">Are you
        sure you want to visit url.com?</p>
      <div>
        <button
          onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT
          SITE</button>
        <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
      </div>
    </div>
  </div>
  <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
    <p id="errorText" style="text-align: center; width:60vw; color:white"></p>
  </div>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <img id="icon-loading" src="/icon-truong-y.png" alt="">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-progress-text">0%</div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-fullscreen-button"></div>
      <button id="capture-button"><i class="fas fa-camera"></i></button>
      <button id="start"><i class="fas fa-video"></i></button>
      <button id="stop" disabled><i class="fas fa-stop"></i></button>
      <button id="downloadRecord-button" disabled>
        <a id="download">
          <i class="fas fa-download"></i>
        </a>
      </button>
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: unityShowBanner,
      // errorHandler: function(err, url, line) {
      //    alert("error " + err + " occurred at line " + line);
      //    // Return 'true' if you handled this error and don't want Unity
      //    // to process it further, 'false' otherwise.
      //    return true;
      // },
    };

    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    // If you would like all file writes inside Unity Application.persistentDataPath
    // directory to automatically persist so that the contents are remembered when
    // the user revisits the site the next time, uncomment the following line:
    // config.autoSyncPersistentDataPath = true;
    // This autosyncing is currently not the default behavior to avoid regressing
    // existing user projects that might rely on the earlier manual
    // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
    // expected to change.

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;

    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "{{{ WIDTH }}}px";
      canvas.style.height = "{{{ HEIGHT }}}px";
      canvas.style.width = "70vw";
      canvas.style.height = "auto";
    }
    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const percentage = Math.round(100 * progress);
        document.querySelector("#unity-progress-bar-full").style.width = percentage + "%";
        document.querySelector("#unity-progress-text").textContent = percentage + "%";
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }, 300);
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);


    function ShowScreenshot(dataUrl) {
      document.getElementById("screenshotDiv").style.display = "flex";
      let img = document.getElementById("screenshotImg");
      img.src = dataUrl;
      img.style.width = "80vw";
      img.style.height = (80 / window.innerWidth * window.innerHeight) + "vw";
    }

    function ShowConfirmUrl(url) {
      document.getElementById("confirmUrlDiv").style.display = "flex";
      window.newUrlString = url;
      document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;
    }

    function ShowError(error) {
      document.getElementById("errorDiv").style.display = "flex";
      document.getElementById("errorText").innerHTML = error;
    }
  </script>
</body>

</html>
